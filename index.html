<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quick Notes</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Quick Notes</h1>
      <div>
        <button type="button" class="add-note-btn" onclick="openNoteDialog()">
          + add note
        </button>
        <button onclick="toggleTheme()" type="button" id="themeToggleBtn" class="theme-toggle-btn">🌙</button>
      </div>
    </header>

    <main id="notesContainer" class="notes-grid"></main>

    <dialog id="noteDialog" class="note-dialog">
      <div class="dialog-content">
        <div class="dialog-header">
          <h2 class="dialog-title" id="dialogTitle">Add New Note</h2>
          <button type="button" class="close-btn" onclick="closeNoteDialog()">x</button>
        </div>

        <form id="noteForm">
          <div class="form-group">
            <label for="noteTitle" class="form-label">Title</label>
            <input type="text" id="noteTitle" class="form-input" placeholder="enter your title.." required />
          </div>

          <div class="form-group">
            <label for="noteContent" class="form-label">Content</label>
            <textarea id="noteContent" class="form-textarea" placeholder="write your content.." required></textarea>
          </div>

          <div class="dialog-actions">
            <button onclick="closeNoteDialog()" type="button" class="cancel-btn">Cancel</button>
            <button type="submit" class="save-btn">Save Note</button>
          </div>
        </form>
      </div>
    </dialog>
  </body>
</html>
